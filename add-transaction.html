<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Expense Tracker | Add Transaction</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-page="add"><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main-content"><header class="topbar"><button class="icon-button menu-button" id="menuButton">☰</button><div><p class="eyebrow">CASH FLOW</p><h1>Add transaction</h1></div><div class="top-actions"><button class="icon-button" id="themeToggle">☾</button></div></header><section class="form-layout"><article class="panel form-panel"><div class="panel-heading"><div><h2>Transaction details</h2><p>Record a new income or expense.</p></div></div><form id="transactionForm" novalidate><div class="type-switch"><label><input type="radio" name="type" value="expense" checked><span>↘ Expense</span></label><label><input type="radio" name="type" value="income"><span>↗ Income</span></label></div><div class="form-grid"><label>Amount <input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required><small class="field-error"></small></label><label>Category <select id="category" required></select><small class="field-error"></small></label><label class="full-width">Description <input id="description" maxlength="80" placeholder="e.g. Lunch with friends (optional)"></label><label class="full-width">Date <input id="date" type="date" required><small class="field-error"></small></label></div><div class="form-actions"><a class="secondary-button" href="transactions.html">Cancel</a><button class="primary-button" type="submit">Add transaction</button></div></form></article><aside class="tip-card"><span>✦</span><h2>Small habits, big results</h2><p>Recording expenses regularly helps you spot spending patterns and reach savings goals sooner.</p><div class="tip-line"></div><p class="muted">Your data stays safely in this browser.</p></aside></section></main></div><div id="toast" class="toast"></div><script src="js/storage.js"></script><script src="js/app.js"></script><script src="js/transactions.js"></script></body></html>
